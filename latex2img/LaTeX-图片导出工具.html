<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaTeX 图片导出工具</title>
  <script>
    window.MathJax = {
      loader: { load: ['input/tex', 'output/svg'] },
      tex: {
        packages: { '[+]': ['ams', 'bbox', 'color', 'cancel'] },
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'local'
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 12px;
      border-right: 1px solid #e5e7eb;
    }

    .toolbar-group:last-child {
      border-right: none;
    }

    label {
      font-size: 14px;
      color: #4b5563;
    }

    select,
    button,
    input[type="color"] {
      height: 36px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    button {
      cursor: pointer;
      transition: all 0.2s ease;
      background: #2563eb;
      color: #fff;
      border: none;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #eef2ff;
      color: #1e40af;
      border: 1px solid #c7d2fe;
    }

    button.secondary:hover {
      background: #e0e7ff;
    }

    .status {
      min-width: 160px;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #374151;
    }

    .status.ok {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #fff;
    }

    .pane + .pane {
      border-left: 1px solid #e5e7eb;
    }

    .pane-header {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 600;
      background: #fafafa;
    }

    .editor-wrap,
    .preview-wrap {
      flex: 1;
      min-height: 0;
      padding: 16px;
    }

    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      line-height: 1.6;
      outline: none;
      background: #fcfcfd;
    }

    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .preview-box {
      width: 100%;
      height: 100%;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      background: linear-gradient(45deg, #f8fafc 25%, transparent 25%),
                  linear-gradient(-45deg, #f8fafc 25%, transparent 25%),
                  linear-gradient(45deg, transparent 75%, #f8fafc 75%),
                  linear-gradient(-45deg, transparent 75%, #f8fafc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 24px;
    }

    .preview-inner {
      background: transparent;
      display: inline-block;
      text-align: center;
      transform-origin: center center;
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #6b7280;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .pane + .pane {
        border-left: none;
        border-top: 1px solid #e5e7eb;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-group">
      <label for="mode">模式</label>
      <select id="mode">
        <option value="display" selected>显示公式</option>
        <option value="inline">行内公式</option>
      </select>
    </div>

    <div class="toolbar-group">
      <label for="scale">尺寸</label>
      <select id="scale">
        <option value="1">1x</option>
        <option value="1.5">1.5x</option>
        <option value="2" selected>2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
      </select>
    </div>

    <div class="toolbar-group">
      <label for="format">格式</label>
      <select id="format">
        <option value="png" selected>PNG</option>
        <option value="jpg">JPG</option>
        <option value="svg">SVG</option>
      </select>
    </div>

    <div class="toolbar-group color-row">
      <label for="bgColor">背景</label>
      <input id="bgColor" type="color" value="#ffffff" />
    </div>

    <div class="toolbar-group">
      <button id="downloadBtn">下载图片</button>
      <button id="copyBtn" class="secondary">复制到剪贴板</button>
    </div>

    <div class="toolbar-group" style="flex:1; border-right:none;">
      <div id="status" class="status">等待输入...</div>
    </div>
  </div>

  <div class="container">
    <div class="pane">
      <div class="pane-header">LaTeX 编辑区</div>
      <div class="editor-wrap">
        <textarea id="latexInput" spellcheck="false">\int_0^\infty e^{-x^2} \, dx = \frac{\sqrt{\pi}}{2}</textarea>
        <div class="hint">
          直接输入 LaTeX 内容即可，例如：<code>\frac{a+b}{c}</code>、<code>\sum_{i=1}^n i</code>
        </div>
      </div>
    </div>

    <div class="pane">
      <div class="pane-header">实时预览</div>
      <div class="preview-wrap">
        <div class="preview-box">
          <div id="preview" class="preview-inner"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const latexInput = document.getElementById('latexInput');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const modeEl = document.getElementById('mode');
    const scaleEl = document.getElementById('scale');
    const formatEl = document.getElementById('format');
    const bgColorEl = document.getElementById('bgColor');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');

    let currentSvgElement = null;
    let renderTimer = null;

    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function debounceRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderLatex, 250);
    }

    async function renderLatex() {
      const latex = latexInput.value.trim();
      const display = modeEl.value === 'display';

      if (!latex) {
        preview.innerHTML = '';
        currentSvgElement = null;
        setStatus('请输入 LaTeX 内容', '');
        return;
      }

      setStatus('正在渲染...', '');

      try {
        const node = await MathJax.tex2svgPromise(latex, { display });
        const svg = node.querySelector('svg');

        if (!svg) {
          throw new Error('未生成 SVG');
        }

        svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        svg.style.maxWidth = '100%';
        svg.style.height = 'auto';

        preview.innerHTML = '';
        preview.appendChild(svg.cloneNode(true));
        currentSvgElement = preview.querySelector('svg');

        setStatus('语法正确，渲染成功', 'ok');
      } catch (err) {
        preview.innerHTML = '';
        currentSvgElement = null;
        setStatus('语法错误：' + (err.message || err), 'error');
      }
    }

    function getSvgString() {
      if (!currentSvgElement) {
        throw new Error('当前没有可导出的预览内容');
      }

      const clone = currentSvgElement.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

      const serializer = new XMLSerializer();
      let svgText = serializer.serializeToString(clone);

      if (!svgText.includes('<?xml')) {
        svgText = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgText;
      }

      return svgText;
    }

    function svgStringToBlob(svgText) {
      return new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('图片加载失败'));
        img.src = src;
      });
    }

    async function svgToCanvas(scale = 2, bgColor = '#ffffff', format = 'png') {
      const svgText = getSvgString();
      const svgBlob = svgStringToBlob(svgText);
      const url = await blobToDataURL(svgBlob);
      const img = await loadImage(url);

      const svg = currentSvgElement;
      let width = parseFloat(svg.getAttribute('width')) || img.width || 300;
      let height = parseFloat(svg.getAttribute('height')) || img.height || 150;

      if ((!width || !height) && svg.viewBox && svg.viewBox.baseVal) {
        width = svg.viewBox.baseVal.width;
        height = svg.viewBox.baseVal.height;
      }

      width = Math.max(1, width);
      height = Math.max(1, height);

      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(width * scale);
      canvas.height = Math.ceil(height * scale);

      const ctx = canvas.getContext('2d');

      if (format === 'jpg') {
        ctx.fillStyle = bgColor || '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        if (bgColor && bgColor !== 'transparent') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.drawImage(img, 0, 0);

      return canvas;
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function exportFile(format) {
      if (!currentSvgElement) {
        alert('请先输入正确的 LaTeX 并成功渲染');
        return;
      }

      const scale = parseFloat(scaleEl.value || '2');
      const bgColor = bgColorEl.value;

      try {
        if (format === 'svg') {
          const svgText = getSvgString();
          const blob = svgStringToBlob(svgText);
          downloadBlob(blob, 'latex-export.svg');
          return;
        }

        const canvas = await svgToCanvas(scale, bgColor, format);
        const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';

        canvas.toBlob((blob) => {
          if (!blob) {
            alert('导出失败');
            return;
          }
          downloadBlob(blob, `latex-export.${format}`);
        }, mimeType, 0.95);
      } catch (err) {
        alert('导出失败：' + (err.message || err));
      }
    }

    async function copyToClipboard(format) {
      if (!currentSvgElement) {
        alert('请先输入正确的 LaTeX 并成功渲染');
        return;
      }

      if (!navigator.clipboard || !window.ClipboardItem) {
        alert('当前浏览器不支持 ClipboardItem 剪贴板图片复制');
        return;
      }

      const scale = parseFloat(scaleEl.value || '2');
      const bgColor = bgColorEl.value;

      try {
        let blob;

        if (format === 'svg') {
          blob = svgStringToBlob(getSvgString());
        } else {
          const canvas = await svgToCanvas(scale, bgColor, format);
          const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
          blob = await new Promise((resolve) => {
            canvas.toBlob(resolve, mimeType, 0.95);
          });
        }

        if (!blob) {
          throw new Error('生成剪贴板数据失败');
        }

        await navigator.clipboard.write([
          new ClipboardItem({
            [blob.type]: blob
          })
        ]);

        setStatus('已复制到剪贴板', 'ok');
      } catch (err) {
        alert('复制失败：' + (err.message || err));
      }
    }

    downloadBtn.addEventListener('click', () => {
      exportFile(formatEl.value);
    });

    copyBtn.addEventListener('click', () => {
      copyToClipboard(formatEl.value);
    });

    latexInput.addEventListener('input', debounceRender);
    modeEl.addEventListener('change', renderLatex);

    window.addEventListener('load', async () => {
      await MathJax.startup.promise;
      renderLatex();
    });
  </script>
</body>
</html>
