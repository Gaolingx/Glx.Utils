<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaTeX 图片导出工具</title>
  <script>
    window.MathJax = {
      loader: { load: ['input/tex', 'output/svg'] },
      tex: {
        packages: { '[+]': ['ams', 'bbox', 'color', 'cancel'] },
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'local'
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .app-title {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      padding-right: 14px;
      margin-right: 2px;
      border-right: 1px solid #e5e7eb;
      white-space: nowrap;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 12px;
      border-right: 1px solid #e5e7eb;
    }

    .toolbar-group:last-child {
      border-right: none;
    }

    label {
      font-size: 14px;
      color: #4b5563;
    }

    select,
    button,
    input[type="color"] {
      height: 36px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    button {
      cursor: pointer;
      transition: all 0.2s ease;
      background: #2563eb;
      color: #fff;
      border: none;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #eef2ff;
      color: #1e40af;
      border: 1px solid #c7d2fe;
    }

    button.secondary:hover {
      background: #e0e7ff;
    }

    .status {
      min-width: 160px;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #374151;
    }

    .status.ok {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #fff;
    }

    .pane + .pane {
      border-left: 1px solid #e5e7eb;
    }

    .pane-header {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 600;
      background: #fafafa;
    }

    .pane-header.with-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .preview-actions button {
      height: 30px;
      padding: 0 10px;
      font-size: 13px;
    }

    .zoom-value {
      min-width: 54px;
      text-align: center;
      font-size: 13px;
      color: #4b5563;
      font-weight: 500;
    }

    .editor-wrap,
    .preview-wrap {
      flex: 1;
      min-height: 0;
      padding: 16px;
    }

    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      line-height: 1.6;
      outline: none;
      background: #fcfcfd;
    }

    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .preview-box {
      width: 100%;
      height: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: linear-gradient(45deg, #f8fafc 25%, transparent 25%),
                  linear-gradient(-45deg, #f8fafc 25%, transparent 25%),
                  linear-gradient(45deg, transparent 75%, #f8fafc 75%),
                  linear-gradient(-45deg, transparent 75%, #f8fafc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 24px;
      position: relative;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .preview-box.dragging {
      cursor: grabbing;
    }

    .preview-box.fullscreen {
      position: fixed;
      inset: 16px;
      z-index: 20;
      height: auto;
      border: 1px solid #d1d5db;
      background-color: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
    }

    .fullscreen-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 21;
      display: none;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(255, 255, 255, 0.72);
      color: #334155;
      font-size: 22px;
      line-height: 1;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(8px);
    }

    .fullscreen-close-btn:hover {
      background: rgba(239, 246, 255, 0.9);
      color: #1d4ed8;
    }

    .preview-box.fullscreen .fullscreen-close-btn {
      display: flex;
    }

    .fullscreen-tools {
      position: absolute;
      top: 54px;
      right: 12px;
      z-index: 21;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .fullscreen-tools button {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(255, 255, 255, 0.72);
      color: #334155;
      font-size: 20px;
      line-height: 1;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(8px);
    }

    .fullscreen-tools button:hover {
      background: rgba(239, 246, 255, 0.9);
      color: #1d4ed8;
    }

    .preview-box.fullscreen .fullscreen-tools {
      display: flex;
    }

    .preview-inner {
      background: transparent;
      display: inline-block;
      text-align: center;
      transform-origin: center center;
      will-change: transform;
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #6b7280;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vba-panel {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.45);
    }

    .vba-panel.show {
      display: flex;
    }

    .vba-dialog {
      width: min(920px, 100%);
      max-height: min(760px, 92vh);
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      overflow: hidden;
    }

    .vba-header,
    .vba-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
      background: #fafafa;
    }

    .vba-actions {
      justify-content: flex-end;
      border-top: 1px solid #e5e7eb;
      border-bottom: none;
    }

    .vba-body {
      padding: 16px;
      min-height: 0;
      overflow: auto;
    }

    .vba-body textarea {
      height: 420px;
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .vba-note {
      margin: 0;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      .pane + .pane {
        border-left: none;
        border-top: 1px solid #e5e7eb;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="app-title">LaTeX 图片导出工具</div>

    <div class="toolbar-group">
      <label for="mode">模式</label>
      <select id="mode">
        <option value="display" selected>显示公式</option>
        <option value="inline">行内公式</option>
      </select>
    </div>

    <div class="toolbar-group">
      <label for="scale">尺寸</label>
      <select id="scale">
        <option value="1">1x</option>
        <option value="1.5">1.5x</option>
        <option value="2" selected>2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
      </select>
    </div>

    <div class="toolbar-group">
      <label for="format">格式</label>
      <select id="format">
        <option value="png" selected>PNG</option>
        <option value="jpg">JPG</option>
        <option value="svg">SVG</option>
      </select>
    </div>

    <div class="toolbar-group color-row">
      <label for="bgColor">背景</label>
      <input id="bgColor" type="color" value="#ffffff" />
    </div>

    <div class="toolbar-group">
      <button id="downloadBtn">下载图片</button>
      <button id="copyBtn" class="secondary">复制到剪贴板</button>
      <button id="vbaBtn" class="secondary">生成 Word VBA</button>
    </div>

    <div class="toolbar-group" style="flex:1; border-right:none;">
      <div id="status" class="status">等待输入...</div>
    </div>
  </div>

  <div id="vbaPanel" class="vba-panel" aria-hidden="true">
    <div class="vba-dialog" role="dialog" aria-modal="true" aria-labelledby="vbaTitle">
      <div class="vba-header">
        <strong id="vbaTitle">Word VBA 代码</strong>
        <button id="closeVbaBtn" class="secondary" type="button">关闭</button>
      </div>
      <div class="vba-body">
        <p class="vba-note">
          下面的宏会把当前公式 SVG 写入临时文件，并插入到 Word 光标位置。复制代码到 Word 的 VBA 编辑器中运行即可。
        </p>
        <textarea id="vbaOutput" readonly spellcheck="false"></textarea>
      </div>
      <div class="vba-actions">
        <button id="copyVbaBtn" type="button">复制 VBA 代码</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="pane">
      <div class="pane-header">LaTeX 编辑区</div>
      <div class="editor-wrap">
        <textarea id="latexInput" spellcheck="false">\int_0^\infty e^{-x^2} \, dx = \frac{\sqrt{\pi}}{2}</textarea>
        <div class="hint">
          直接输入 LaTeX 内容即可，例如：<code>\frac{a+b}{c}</code>、<code>\sum_{i=1}^n i</code>
        </div>
      </div>
    </div>

    <div class="pane">
      <div class="pane-header with-actions">
        <span>实时预览</span>
        <div class="preview-actions">
          <button id="zoomOutBtn" class="secondary" type="button">➖</button>
          <span id="zoomValue" class="zoom-value">100%</span>
          <button id="zoomInBtn" class="secondary" type="button">➕</button>
          <button id="resetViewBtn" class="secondary" type="button">🔄</button>
          <button id="fullscreenBtn" class="secondary" type="button">⛶</button>
        </div>
      </div>
      <div class="preview-wrap">
        <div id="previewBox" class="preview-box">
          <button id="fullscreenCloseBtn" class="fullscreen-close-btn" type="button" aria-label="关闭全屏预览">×</button>
          <div class="fullscreen-tools" aria-label="全屏预览工具">
            <button id="fullscreenZoomInBtn" type="button" aria-label="放大全屏预览">＋</button>
            <button id="fullscreenZoomOutBtn" type="button" aria-label="缩小全屏预览">－</button>
            <button id="fullscreenResetBtn" type="button" aria-label="重置全屏预览">↺</button>
          </div>
          <div id="preview" class="preview-inner"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const latexInput = document.getElementById('latexInput');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const modeEl = document.getElementById('mode');
    const scaleEl = document.getElementById('scale');
    const formatEl = document.getElementById('format');
    const bgColorEl = document.getElementById('bgColor');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');
    const vbaBtn = document.getElementById('vbaBtn');
    const previewBox = document.getElementById('previewBox');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const resetViewBtn = document.getElementById('resetViewBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fullscreenCloseBtn = document.getElementById('fullscreenCloseBtn');
    const fullscreenZoomInBtn = document.getElementById('fullscreenZoomInBtn');
    const fullscreenZoomOutBtn = document.getElementById('fullscreenZoomOutBtn');
    const fullscreenResetBtn = document.getElementById('fullscreenResetBtn');
    const zoomValue = document.getElementById('zoomValue');
    const vbaPanel = document.getElementById('vbaPanel');
    const vbaOutput = document.getElementById('vbaOutput');
    const closeVbaBtn = document.getElementById('closeVbaBtn');
    const copyVbaBtn = document.getElementById('copyVbaBtn');

    let currentSvgElement = null;
    let renderTimer = null;
    let previewScale = 1;
    let previewOffsetX = 0;
    let previewOffsetY = 0;
    let isDraggingPreview = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragOriginX = 0;
    let dragOriginY = 0;

    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function debounceRender() {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderLatex, 250);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function applyPreviewTransform() {
      preview.style.transform = `translate(${previewOffsetX}px, ${previewOffsetY}px)`;
      preview.style.fontSize = (previewScale * 100) + '%';
      zoomValue.textContent = Math.round(previewScale * 100) + '%';
    }

    function resetPreviewView() {
      previewScale = 1;
      previewOffsetX = 0;
      previewOffsetY = 0;
      applyPreviewTransform();
    }

    function zoomPreview(delta, centerX, centerY) {
      const oldScale = previewScale;
      const nextScale = clamp(oldScale * delta, 0.2, 8);

      if (nextScale === oldScale) {
        return;
      }

      if (typeof centerX === 'number' && typeof centerY === 'number') {
        const box = previewBox.getBoundingClientRect();
        const dx = centerX - box.left - box.width / 2 - previewOffsetX;
        const dy = centerY - box.top - box.height / 2 - previewOffsetY;
        const ratio = nextScale / oldScale;
        previewOffsetX -= dx * (ratio - 1);
        previewOffsetY -= dy * (ratio - 1);
      }

      previewScale = nextScale;
      applyPreviewTransform();
    }

    function isPreviewControl(target) {
      return target.closest('button');
    }

    function setPreviewFullscreen(isFullscreen) {
      previewBox.classList.toggle('fullscreen', isFullscreen);
      fullscreenBtn.textContent = isFullscreen ? '退出全屏' : '⛶';
    }

    async function renderLatex() {
      const latex = latexInput.value.trim();
      const display = modeEl.value === 'display';

      if (!latex) {
        preview.innerHTML = '';
        currentSvgElement = null;
        setStatus('请输入 LaTeX 内容', '');
        return;
      }

      setStatus('正在渲染...', '');

      try {
        const node = await MathJax.tex2svgPromise(latex, { display });
        const svg = node.querySelector('svg');

        if (!svg) {
          throw new Error('未生成 SVG');
        }

        svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        svg.style.maxWidth = '100%';
        svg.style.height = 'auto';

        preview.innerHTML = '';
        preview.appendChild(svg.cloneNode(true));
        currentSvgElement = preview.querySelector('svg');
        resetPreviewView();

        setStatus('语法正确，渲染成功', 'ok');
      } catch (err) {
        preview.innerHTML = '';
        currentSvgElement = null;
        setStatus('语法错误：' + (err.message || err), 'error');
      }
    }

    function getSvgString() {
      if (!currentSvgElement) {
        throw new Error('当前没有可导出的预览内容');
      }

      const clone = currentSvgElement.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

      const serializer = new XMLSerializer();
      let svgText = serializer.serializeToString(clone);

      if (!svgText.includes('<?xml')) {
        svgText = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgText;
      }

      return svgText;
    }

    function svgStringToBlob(svgText) {
      return new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
    }

    function blobToDataURL(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('图片加载失败'));
        img.src = src;
      });
    }

    function getSvgExportSize(img) {
      const rect = currentSvgElement.getBoundingClientRect();
      let width = rect.width || img.naturalWidth || img.width || 300;
      let height = rect.height || img.naturalHeight || img.height || 150;

      if ((!width || !height) && currentSvgElement.viewBox && currentSvgElement.viewBox.baseVal) {
        const viewBox = currentSvgElement.viewBox.baseVal;
        width = viewBox.width;
        height = viewBox.height;
      }

      return {
        width: Math.max(1, width),
        height: Math.max(1, height)
      };
    }

    async function svgToCanvas(scale = 2, bgColor = '#ffffff', format = 'png') {
      const svgText = getSvgString();
      const svgBlob = svgStringToBlob(svgText);
      const url = await blobToDataURL(svgBlob);
      const img = await loadImage(url);
      const { width, height } = getSvgExportSize(img);

      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(width * scale);
      canvas.height = Math.ceil(height * scale);

      const ctx = canvas.getContext('2d');

      if (format === 'jpg') {
        ctx.fillStyle = bgColor || '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        if (bgColor && bgColor !== 'transparent') {
          ctx.fillStyle = bgColor;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.drawImage(img, 0, 0, width, height);

      return canvas;
    }

    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function escapeVbaString(text) {
      return text.replace(/"/g, '""');
    }

    function splitForVba(text, chunkSize = 900) {
      const chunks = [];
      for (let i = 0; i < text.length; i += chunkSize) {
        chunks.push(text.slice(i, i + chunkSize));
      }
      return chunks;
    }

    function buildWordVba(svgText) {
      const safeSvgText = svgText.replace(/\r?\n/g, '');
      const chunks = splitForVba(safeSvgText);
      const lines = [
        'Sub InsertLatexSvgPicture()',
        '    Dim svgText As String',
        '    Dim tempPath As String',
        '    Dim fileNo As Integer',
        '',
        '    svgText = ""'
      ];

      chunks.forEach((chunk) => {
        lines.push('    svgText = svgText & "' + escapeVbaString(chunk) + '"');
      });

      lines.push(
        '',
        '    tempPath = Environ$("TEMP") & "\\latex-export-" & Format(Now, "yyyymmdd-hhnnss") & ".svg"',
        '    fileNo = FreeFile',
        '    Open tempPath For Output As #fileNo',
        '    Print #fileNo, svgText',
        '    Close #fileNo',
        '',
        '    Selection.InlineShapes.AddPicture FileName:=tempPath, LinkToFile:=False, SaveWithDocument:=True',
        'End Sub'
      );

      return lines.join('\n');
    }

    function openVbaPanel() {
      if (!currentSvgElement) {
        alert('请先输入正确的 LaTeX 并成功渲染');
        return;
      }

      try {
        vbaOutput.value = buildWordVba(getSvgString());
        vbaPanel.classList.add('show');
        vbaPanel.setAttribute('aria-hidden', 'false');
        vbaOutput.focus();
        vbaOutput.select();
      } catch (err) {
        alert('生成 VBA 失败：' + (err.message || err));
      }
    }

    function closeVbaPanel() {
      vbaPanel.classList.remove('show');
      vbaPanel.setAttribute('aria-hidden', 'true');
    }

    async function copyVbaCode() {
      if (!vbaOutput.value) {
        return;
      }

      try {
        await navigator.clipboard.writeText(vbaOutput.value);
        setStatus('已复制 VBA 代码', 'ok');
      } catch (err) {
        vbaOutput.focus();
        vbaOutput.select();
        document.execCommand('copy');
        setStatus('已复制 VBA 代码', 'ok');
      }
    }

    async function exportFile(format) {
      if (!currentSvgElement) {
        alert('请先输入正确的 LaTeX 并成功渲染');
        return;
      }

      const scale = parseFloat(scaleEl.value || '2');
      const bgColor = bgColorEl.value;

      try {
        if (format === 'svg') {
          const svgText = getSvgString();
          const blob = svgStringToBlob(svgText);
          downloadBlob(blob, 'latex-export.svg');
          return;
        }

        const canvas = await svgToCanvas(scale, bgColor, format);
        const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';

        canvas.toBlob((blob) => {
          if (!blob) {
            alert('导出失败');
            return;
          }
          downloadBlob(blob, `latex-export.${format}`);
        }, mimeType, 0.95);
      } catch (err) {
        alert('导出失败：' + (err.message || err));
      }
    }

    async function copyToClipboard(format) {
      if (!currentSvgElement) {
        alert('请先输入正确的 LaTeX 并成功渲染');
        return;
      }

      if (!navigator.clipboard || !window.ClipboardItem) {
        alert('当前浏览器不支持 ClipboardItem 剪贴板图片复制');
        return;
      }

      const scale = parseFloat(scaleEl.value || '2');
      const bgColor = bgColorEl.value;

      try {
        let blob;

        if (format === 'svg') {
          blob = svgStringToBlob(getSvgString());
        } else {
          const canvas = await svgToCanvas(scale, bgColor, format);
          const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
          blob = await new Promise((resolve) => {
            canvas.toBlob(resolve, mimeType, 0.95);
          });
        }

        if (!blob) {
          throw new Error('生成剪贴板数据失败');
        }

        await navigator.clipboard.write([
          new ClipboardItem({
            [blob.type]: blob
          })
        ]);

        setStatus('已复制到剪贴板', 'ok');
      } catch (err) {
        alert('复制失败：' + (err.message || err));
      }
    }

    downloadBtn.addEventListener('click', () => {
      exportFile(formatEl.value);
    });

    copyBtn.addEventListener('click', () => {
      copyToClipboard(formatEl.value);
    });

    zoomOutBtn.addEventListener('click', () => zoomPreview(0.8));
    zoomInBtn.addEventListener('click', () => zoomPreview(1.25));
    resetViewBtn.addEventListener('click', resetPreviewView);
    fullscreenBtn.addEventListener('click', () => {
      setPreviewFullscreen(!previewBox.classList.contains('fullscreen'));
    });

    fullscreenCloseBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      setPreviewFullscreen(false);
    });

    fullscreenZoomInBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      zoomPreview(1.25);
    });

    fullscreenZoomOutBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      zoomPreview(0.8);
    });

    fullscreenResetBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      resetPreviewView();
    });

    previewBox.addEventListener('wheel', (event) => {
      event.preventDefault();
      zoomPreview(event.deltaY < 0 ? 1.1 : 0.9, event.clientX, event.clientY);
    }, { passive: false });

    previewBox.addEventListener('pointerdown', (event) => {
      if (!currentSvgElement || isPreviewControl(event.target)) {
        return;
      }

      isDraggingPreview = true;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragOriginX = previewOffsetX;
      dragOriginY = previewOffsetY;
      previewBox.classList.add('dragging');
      previewBox.setPointerCapture(event.pointerId);
    });

    previewBox.addEventListener('pointermove', (event) => {
      if (!isDraggingPreview) {
        return;
      }

      previewOffsetX = dragOriginX + event.clientX - dragStartX;
      previewOffsetY = dragOriginY + event.clientY - dragStartY;
      applyPreviewTransform();
    });

    function stopPreviewDrag(event) {
      if (!isDraggingPreview) {
        return;
      }

      isDraggingPreview = false;
      previewBox.classList.remove('dragging');

      if (event && previewBox.hasPointerCapture(event.pointerId)) {
        previewBox.releasePointerCapture(event.pointerId);
      }
    }

    previewBox.addEventListener('pointerup', stopPreviewDrag);
    previewBox.addEventListener('pointercancel', stopPreviewDrag);

    vbaBtn.addEventListener('click', openVbaPanel);
    closeVbaBtn.addEventListener('click', closeVbaPanel);
    copyVbaBtn.addEventListener('click', copyVbaCode);

    vbaPanel.addEventListener('click', (event) => {
      if (event.target === vbaPanel) {
        closeVbaPanel();
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && vbaPanel.classList.contains('show')) {
        closeVbaPanel();
      }

      if (event.key === 'Escape' && previewBox.classList.contains('fullscreen')) {
        setPreviewFullscreen(false);
      }
    });

    latexInput.addEventListener('input', debounceRender);
    modeEl.addEventListener('change', renderLatex);

    window.addEventListener('load', async () => {
      await MathJax.startup.promise;
      renderLatex();
    });
  </script>
</body>
</html>
